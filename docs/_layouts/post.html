---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.tags.size > 0 %}
      · {% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}
    {% endif %}
  </p>
  {{ content }}
</article>

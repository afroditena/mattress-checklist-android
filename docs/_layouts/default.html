<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  {% include head-custom.html %}
  {% if site.google_analytics %}
  <!-- Google Analytics 4 (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.7;
    }
    header.site-header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(128,128,128,0.3);
    }
    header.site-header a {
      text-decoration: none;
      font-weight: 700;
      font-size: 1.25rem;
    }
    header.site-header nav {
      display: inline-block;
      float: right;
      font-size: 0.85rem;
      margin-top: 6px;
    }
    header.site-header nav a {
      font-weight: 400;
      font-size: 0.85rem;
      opacity: 0.75;
      margin-left: 16px;
    }
    footer.site-footer a {
      color: inherit;
    }
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin-bottom: 20px; }
    .post-list time { display: block; font-size: 0.85rem; opacity: 0.7; }
    .post-meta { font-size: 0.85rem; opacity: 0.7; margin-bottom: 24px; }
    footer.site-footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid rgba(128,128,128,0.3);
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/about' | relative_url }}">소개</a>
      <a href="{{ '/privacy' | relative_url }}">개인정보처리방침</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>이 블로그의 글은 AI(Claude)의 도움을 받아 자동으로 생성됩니다. · <a href="{{ '/about' | relative_url }}">소개</a> · <a href="{{ '/privacy' | relative_url }}">개인정보처리방침</a></p>
  </footer>
</body>
</html>

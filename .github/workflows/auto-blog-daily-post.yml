name: Auto Blog Daily Post

# 참고: 스케줄(cron) 트리거는 GitHub 정책상 "기본 브랜치(main)"에 있는
# 워크플로 파일 기준으로만 동작합니다. 이 워크플로가 main에 병합되기 전까지는
# 자동으로 실행되지 않고, Actions 탭에서 수동 실행(workflow_dispatch)만 가능합니다.
on:
  schedule:
    - cron: "0 22 * * *" # 매일 UTC 22:00 = 한국시간(KST) 오전 7시
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r auto-blog-autopilot/requirements.txt

      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 아래 4개는 구글 Blogger 동시 발행용 (선택, 미설정이면 자동으로 건너뜀)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 무료 스톡 사진(Unsplash) 자동 삽입용 (선택, 미설정이면 이미지 없이 발행)
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # 주제 선정 시 GA4(자체 유입량/체류시간) 순위 매기기용
          # (선택, 미설정이면 검색량 순위만 또는 기존 큐 순서(FIFO)로 동작)
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          # 주제 선정 시 네이버 데이터랩(검색어트렌드) 순위 매기기용
          # (선택, 미설정이면 이 신호 없이 동작)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python auto-blog-autopilot/scripts/generate_post.py

      - name: Commit and push new post
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/_posts auto-blog-autopilot/data/topics.txt
          # manual_topic.json / manual_topic_queue.json은 존재할 때만 있는 선택적
          # 파일이라, 이미 소비되어 없어진(그리고 그 삭제가 예전에 커밋된) 상태에서
          # 그대로 "git add"하면 "pathspec did not match any files"로 실패한다
          # (실제로 이 버그 때문에 발행은 성공했는데 커밋/푸시가 통째로 실패한 적이
          # 있었다). 지금 워킹트리에 있거나(정상 케이스), 이번 커밋 기준으로
          # 추적되고 있을 때만(이번에 막 지워진 케이스) add 한다.
          for f in auto-blog-autopilot/data/manual_topic.json auto-blog-autopilot/data/manual_topic_queue.json; do
            if [ -e "$f" ] || git cat-file -e "HEAD:$f" 2>/dev/null; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 건너뜀"
          else
            git commit -m "chore: 자동 블로그 포스트 발행 ($(date +%Y-%m-%d))"
            git push
          fi

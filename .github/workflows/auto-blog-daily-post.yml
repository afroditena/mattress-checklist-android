name: Auto Blog Daily Post

# 참고: 스케줄(cron) 트리거는 GitHub 정책상 "기본 브랜치(main)"에 있는
# 워크플로 파일 기준으로만 동작합니다. 이 워크플로가 main에 병합되기 전까지는
# 자동으로 실행되지 않고, Actions 탭에서 수동 실행(workflow_dispatch)만 가능합니다.
on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = 한국시간(KST) 오전 7시 (다음날) - new-maind(A/B/C/E) 전용, REST_WEEKDAYS(화/일)엔 스스로 건너뜀
    - cron: "0 0 * * *"  # UTC 00:00 = KST 오전 9시 - simple-tech-fix(D) #1
    - cron: "0 3 * * *"  # UTC 03:00 = KST 낮 12시 - simple-tech-fix(D) #2
    - cron: "0 8 * * *"  # UTC 08:00 = KST 오후 5시 - simple-tech-fix(D) #3
  workflow_dispatch:
    inputs:
      fix_known_post_title:
        description: >-
          true로 실행하면 평소 발행을 건너뛰고, 2026-08-21 글이 AI 폴백
          제목("자동 생성 포스트")으로 잘못 나간 버그만 일회성으로 고침
          (fix_known_post_title() 참고). 평소엔 항상 false로 두면 됨.
        required: false
        default: "false"
      force_niche_cluster:
        description: >-
          비워두면 평소대로 클러스터 가중치 기반 가중 무작위로 선택.
          A/B/C/D/E 중 하나를 넣으면 그 클러스터로만 강제 선택 - 특정
          포맷이나(예: D는 두 번째 Blogger 블로그로 라우팅됨) 클러스터를
          미리 확인해보고 싶을 때 사용.
        required: false
        default: ""
      run_arms:
        description: >-
          비워두면 이번 실행에서 일반 니치(new-maind)와 트러블슈팅 전용
          일일(simple-tech-fix) 갈래를 둘 다 실행. "general"이면 new-maind
          갈래만, "tech_fix"면 simple-tech-fix 갈래만 강제 지정 - 수동
          검증용. 스케줄(cron) 실행은 이 값과 무관하게 어느 cron이 켰는지로
          자동 결정됨(아래 RUN_ARMS 계산 참고).
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r auto-blog-autopilot/requirements.txt

      - name: Install Playwright browser (Chromium only)
        # SOURCES(공식 페이지)를 직접 캡처하는 데만 쓰므로 Chromium 하나면
        # 충분하다. 실패해도(네트워크 문제 등) 본 발행 자체를 막지 않도록
        # continue-on-error로 두고, generate_post.py 쪽은 playwright 실행
        # 자체가 실패하면 조용히 Unsplash로 대체한다.
        run: python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Generate today's post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_FIX_KNOWN_POST_TITLE: ${{ github.event.inputs.fix_known_post_title || 'false' }}
          FORCE_NICHE_CLUSTER: ${{ github.event.inputs.force_niche_cluster || '' }}
          # 스케줄(cron) 실행이면 어느 cron이 켰는지로 갈래를 자동 결정하고
          # (아래 4개 cron 중 "0 22 * * *"만 new-maind 전용, 나머지 3개는
          # simple-tech-fix 전용), workflow_dispatch 수동 실행이면 입력값을
          # 그대로 쓴다(비어있으면 둘 다 실행). generate_post.py의
          # RUN_ARMS 처리 참고.
          RUN_ARMS: >-
            ${{
              github.event.schedule == '0 22 * * *' && 'general'
              || (github.event.schedule == '0 0 * * *' || github.event.schedule == '0 3 * * *' || github.event.schedule == '0 8 * * *') && 'tech_fix'
              || github.event.inputs.run_arms
              || ''
            }}
          # 아래 4개는 구글 Blogger 동시 발행용 (선택, 미설정이면 자동으로 건너뜀)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 공식 페이지 캡처가 하나도 성공 못 했을 때만 대표 이미지로 쓰는
          # Unsplash 폴백용 (선택, 미설정이면 이미지 없이 발행)
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python auto-blog-autopilot/scripts/generate_post.py

      - name: Commit and push new post
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/_posts
          # docs/assets(캡처한 스크린샷)와 used_topic_ids.json은 이번 실행에서
          # 처음 생성됐을 수도 있는 파일/폴더라, 아직 한 번도 없었으면
          # "git add"가 "pathspec did not match any files"로 실패한다
          # (manual_topic.json 계열과 같은 이유 - 존재하거나 이미 추적 중일
          # 때만 add 한다).
          for f in docs/assets auto-blog-autopilot/data/used_topic_ids.json \
                   auto-blog-autopilot/data/manual_topic.json auto-blog-autopilot/data/manual_topic_queue.json; do
            if [ -e "$f" ] || git cat-file -e "HEAD:$f" 2>/dev/null; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 사항 없음 - 커밋 건너뜀"
          elif [ "${{ github.event.inputs.fix_known_post_title || 'false' }}" = "true" ]; then
            git commit -m "chore: 일회성 유지보수 - 8/21 글 폴백 제목 수정 ($(date +%Y-%m-%d))"
            git push
          else
            git commit -m "chore: 자동 블로그 포스트 발행 ($(date +%Y-%m-%d))"
            git push
          fi

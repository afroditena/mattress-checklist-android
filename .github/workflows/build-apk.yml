name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Files
        run: ls -R

      - name: Upload Project
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProject
          path: .
